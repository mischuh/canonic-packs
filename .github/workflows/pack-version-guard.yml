name: pack-version-guard

on:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check pack.yaml version is bumped when a pack's content changes
        run: |
          git fetch origin "${{ github.base_ref }}"
          python scripts/check_pack_version_bump.py "origin/${{ github.base_ref }}"
