name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The first canonic release containing `canonic pack validate` (PR #335, released as
  # 0.29.0). Bump by hand in a follow-up PR when a newer canonic release matters to pack
  # validation — this is a normal version pin, not a workaround.
  CANONIC_VERSION: "0.29.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Validate packs
        run: uvx --from "canonic==${{ env.CANONIC_VERSION }}" canonic pack validate .
