name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The first canonic release containing `canonic pack validate` was 0.29.0 (PR #335).
  # 0.31.0 is the first with `dimensions[].expr` (PR #351), which the stripe pack needs.
  # 0.32.0 is the first with `dimensions[].json_path` and `min_canonic_version`, which the
  # posthog pack needs. Older releases ignore both fields and would validate the pack anyway.
  # Bump by hand in a follow-up PR when a newer canonic release matters to pack
  # validation — this is a normal version pin, not a workaround.
  CANONIC_VERSION: "0.32.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Validate packs
        run: uvx --from "canonic==${{ env.CANONIC_VERSION }}" canonic pack validate .
